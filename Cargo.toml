[package]
name = "ict-jig-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generate 3D-printable ICT pogo-pin test cassettes from EasyEDA Gerber/Excellon packages"
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
earcutr = "0.5.0"
imagesize = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Groups use a negative priority so the individual lints below can override them.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must propagate errors, never abort. Tests are exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Pedantic lints that are too noisy for this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dev-dependencies]
tempfile = "3.27.0"
